name: Documentation correction
description: Report a claim, link, date or explanation that needs correction.
title: "[Docs] "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link the file, page and section.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current statement
      description: Summarize the statement without reproducing unnecessary copyrighted text.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or unclear?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link a public source or explain how the mismatch can be reproduced.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: false
