name: Forum site

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the organization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api -X GET search/issues -f q='org:draykerdk is:issue' -f sort=updated -f order=desc -F per_page=60 > /tmp/issues.json
          gh api -X GET search/issues -f q='org:draykerdk is:pr is:merged' -f sort=updated -f order=desc -F per_page=24 > /tmp/prs.json
          jq -n \
            --slurpfile i /tmp/issues.json \
            --slurpfile p /tmp/prs.json \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              generated_at: $now,
              threads: [$i[0].items[] | {
                num: .number, title: .title, url: .html_url,
                repo: (.repository_url | split("/") | last),
                labels: [.labels[].name | ascii_downcase],
                user: (.user.login // ""), body: (.body // ""),
                comments: .comments, at: .updated_at, open: (.state != "closed")
              }],
              decisions: [$p[0].items[] | {
                num: .number, title: .title, url: .html_url,
                repo: (.repository_url | split("/") | last),
                user: (.user.login // ""), at: (.closed_at // .updated_at)
              }]
            }' > data/forum.json
      - name: Generate routes and social metadata
        run: node tools/prerender.js
      - name: Validate forum
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
