name: Forum site

on:
  push:
    branches:
      - master
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the snapshot from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-forum-snapshot.js --out _site
      - name: Prerender pages, sitemap and feeds
        run: node tools/prerender.js --out _site
      - name: Validate the site
        run: npm test
      # push and workflow_dispatch always deploy. A scheduled run deploys only
      # when content_hash or site_rev differ from the live data/meta.json.
      - name: Decide whether to deploy
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node tools/deploy-decision.js --event "$EVENT_NAME" --meta _site/data/meta.json --live https://forum.drayker.org/data/meta.json
      - name: Configure GitHub Pages
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
