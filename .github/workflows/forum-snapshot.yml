# Atualiza data/forum.json no formato exato que o site consome, uma vez por dia.
name: Forum snapshot
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the organization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api -X GET search/issues -f q='org:draykerdk is:issue' -f sort=updated -f order=desc -F per_page=60 > /tmp/issues.json
          gh api -X GET search/issues -f q='org:draykerdk is:pr is:merged' -f sort=updated -f order=desc -F per_page=24 > /tmp/prs.json
          jq -n \
            --slurpfile i /tmp/issues.json \
            --slurpfile p /tmp/prs.json \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              generated_at: $now,
              threads: [$i[0].items[] | {
                num: .number, title: .title, url: .html_url,
                repo: (.repository_url | split("/") | last),
                labels: [.labels[].name | ascii_downcase],
                user: (.user.login // ""), body: (.body // ""),
                comments: .comments, at: .updated_at, open: (.state != "closed")
              }],
              decisions: [$p[0].items[] | {
                num: .number, title: .title, url: .html_url,
                repo: (.repository_url | split("/") | last),
                user: (.user.login // ""), at: (.closed_at // .updated_at)
              }]
            }' > data/forum.json
      - name: Publish clean thread routes and social metadata
        run: node tools/prerender.js
      - name: Commit when it changed
        run: |
          git config user.name  'drayker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/forum.json sitemap.xml t
          git diff --cached --quiet || git commit -m 'forum snapshot'
          git push
