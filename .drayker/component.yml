schema_version: 1
component:
  id: general-forum
  name: General Forum
  layer: COMMUNITY
  artifact_type: community-entrypoint
  problem: Give questions, volunteer introductions and proposals a public starting point when no component-specific route is clear.
  scope:
    - Structured public issue intake and routing governed by Principle 07 (kind to people, relentless with ideas).
    - Volunteer introductions and partnership proposals.
    - A static reading surface over public issues and merged pull requests across the Drayker organization.
  non_scope:
    - Private applications or guaranteed placement.
    - Binding governance decisions or project management.
  dependencies:
    - drayker.org
    - emergence-initiative
  implementation:
    level: operational
    scope: GitHub Issues provide public intake and routing; forum.drayker.org provides a static reading and composing surface while publication and follow-through remain on GitHub.
    evidence:
      - type: usage
        ref: https://github.com/draykerdk/general-forum/issues
      - type: document
        ref: README.md
      - type: deployment
        ref: https://forum.drayker.org/
  risks:
    - Public issue content can expose information contributors intended to keep private.
    - Unclear routing can leave submissions without a next action.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/general-forum/issues/new/choose
  source_of_truth:
    repository: https://github.com/draykerdk/general-forum
    path: README.md
  last_reviewed: "2026-09-08"
